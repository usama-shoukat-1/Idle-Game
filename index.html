<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#0e1116" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="RESTORE IT! - restore abandoned buildings, build businesses, grow the city." />
    <title>RESTORE IT!</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
  </head>
  <body>
    <div id="game-root" aria-label="RESTORE IT! game canvas">
      <div id="boot-splash">
        <div class="boot-splash__mark">RESTORE IT!</div>
        <div class="boot-splash__hint">Preparing the foundation…</div>
      </div>
    </div>

    <div id="orientation-hint" role="status">
      <div class="orientation-hint__mark">↻</div>
      <div>RESTORE IT! is designed for portrait play. Please rotate your device.</div>
    </div>

    <noscript>RESTORE IT! requires JavaScript to run.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
